# pgbouncer.ini
[databases]
postgres = host=patroni port=5432 dbname=postgres
aztec-indexer = host=patroni port=5432 dbname=aztec-indexer
aztec-adversarial-testnet = host=patroni port=5432 dbname=aztec-adversarial-testnet
aztec-testnet-1 = host=patroni port=5432 dbname=aztec-testnet-1
[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Pool configuration
pool_mode = transaction
max_client_conn = 100000
default_pool_size = 100
min_pool_size = 25
reserve_pool_size = 50
reserve_pool_timeout = 3
max_db_connections = 500
max_user_connections = 500

# Connection behavior
server_reset_query = DISCARD ALL
server_check_delay = 60
server_check_query = SELECT 1
server_fast_close = 1
server_idle_timeout = 300
server_connect_timeout = 10

# Performance - ignore startup parameters
ignore_startup_parameters = extra_float_digits,options,search_path

# Timeouts
query_timeout = 60
query_wait_timeout = 30
client_idle_timeout = 600
idle_transaction_timeout = 30

# Logging
admin_users = postgres
log_pooler_errors = 1
