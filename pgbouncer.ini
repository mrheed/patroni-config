[databases]
postgres = host=patroni port=5432 dbname=postgres pool_size=200
aztec-indexer = host=patroni port=5432 dbname=aztec-indexer pool_size=200
aztec-adversarial-testnet = host=patroni port=5432 dbname=aztec-adversarial-testnet pool_size=100
aztec-testnet-1 = host=patroni port=5432 dbname=aztec-testnet-1 pool_size=100

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Pool configuration
pool_mode = transaction
max_client_conn = 100000
default_pool_size = 100
min_pool_size = 20
reserve_pool_size = 50
reserve_pool_timeout = 3
max_db_connections = 450
max_user_connections = 450

# Connection behavior
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = SELECT 1
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15

# Performance
ignore_startup_parameters = extra_float_digits,options,search_path

# Timeouts - important for blockchain queries
query_timeout = 30
query_wait_timeout = 120
client_idle_timeout = 0
idle_transaction_timeout = 0

# Logging
admin_users = postgres
stats_users = postgres
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
verbose = 0
