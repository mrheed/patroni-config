bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      pg_hba:
      - host replication replicator 127.0.0.1/32 md5
      - host replication replicator 0.0.0.0/0 md5
      - host all all 0.0.0.0/0 md5
      parameters:
        # Connection settings
        max_connections: 500
        superuser_reserved_connections: 10
        
        # Memory - aggressive for blockchain data
        shared_buffers: 16GB
        work_mem: 32MB
        maintenance_work_mem: 2GB
        effective_cache_size: 48GB
        
        # WAL - critical for high write throughput
        wal_buffers: 64MB
        min_wal_size: 4GB
        max_wal_size: 16GB
        checkpoint_timeout: 30min
        checkpoint_completion_target: 0.9
        wal_compression: on
        
        # Replication
        max_wal_senders: 10
        wal_keep_size: 8GB
        max_replication_slots: 10
        
        # Durability - blockchain indexing specific
        synchronous_commit: off
        wal_writer_delay: 200ms
        commit_delay: 100
        commit_siblings: 10
        
        # Query planner
        random_page_cost: 1.1
        effective_io_concurrency: 200
        
        # Parallelism - aggressive for complex queries
        max_worker_processes: 32
        max_parallel_workers: 24
        max_parallel_workers_per_gather: 8
        max_parallel_maintenance_workers: 4
        parallel_leader_participation: on
        
        # Performance
        jit: on
        jit_above_cost: 100000
        
        # Logging - minimal for 100k queries
        logging_collector: on
        log_min_duration_statement: 5000
        log_checkpoints: on
        log_connections: off
        log_disconnections: off
        log_lock_waits: on
        log_temp_files: 100MB
        log_autovacuum_min_duration: 1000
        
        # Autovacuum - critical for blockchain indexing
        autovacuum_max_workers: 6
        autovacuum_naptime: 10s
        autovacuum_vacuum_cost_limit: 2000
        autovacuum_vacuum_scale_factor: 0.05
        autovacuum_analyze_scale_factor: 0.02
        
  initdb:
    - encoding: UTF8
    - data-checksums
postgresql:
  bin_dir: /usr/lib/postgresql/17/bin
  authentication:
    superuser:
      username: postgres
      password: postgres
    replication:
      username: replicator
      password: replicate
